name: Production CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile application
        run: mvn -B -DskipTests compile

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests with coverage
        run: mvn -B test jacoco:report

  quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run quality gates
        run: mvn -B verify

      - name: SonarCloud analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'your-sonar-organization' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'demo-cicd' }}
            -Dsonar.java.binaries=target/classes

      - name: Snyk security scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/maven@master
        with:
          args: --severity-threshold=high --all-projects

  package:
    name: Package Artifact
    runs-on: ubuntu-24.04
    needs: [test, quality]

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Create production JAR
        run: mvn -B clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: spring-boot-app-jar
          path: target/*.jar
          retention-days: 30
